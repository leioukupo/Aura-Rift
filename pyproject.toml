[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-rift"
version = "0.1.0"
description = "Linux ComfyUI launcher inspired by ComfyUI-Aki."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
]

[project.scripts]
aura-rift = "aura_rift.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundled 绘世 visuals/fonts extracted from the local Aki resources assembly.
# Keep the nested head_images variants in wheels as well as the primary banner
# and avatar files at resources/.
aura_rift = [
  "resources/*.jpg",
  "resources/*.png",
  "resources/*.ttf",
  "resources/*.md",
  "resources/*.json",
  "resources/head_images/*.jpg",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
